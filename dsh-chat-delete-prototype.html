<script>

 ]},
{id:2,tool:false,stray:true,streaming:false,status:'已完成，用时 6 秒',tok:310,

{id:3,tool:false,stray:false,streaming:false,status:'已完成，用时 18 秒',tok:1180,

 ]},
{id:4,tool:false,stray:false,streaming:true,status:'',tok:0,
 user:'再加一个导出 Excel 的功能',
 blocks:[{t:'text',s:'正在生成…'}]}
];
var BASE=2910;
var S={tab:'dialog',mode:'normal',sel:{},del:{},exp:{},back:{},streaming:true,trace:true,menu:null};
function $(id){ return document.getElementById(id); }
function el(tag,cls,text){ var n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.appendChild(document.createTextNode(text)); return n; }
function short(s,n){ return s.length>n?s.slice(0,n)+'…':s; }
function countSel(){ var n=0; for(var k in S.sel){ if(S.sel[k]) n++; } return n; }
function selIds(){ var a=[]; for(var k in S.sel){ if(S.sel[k]) a.push(Number(k)); } a.sort(function(x,y){return x-y;}); return a; }
function tokNow(){ var t=0; for(var i=0;i<TURNS.length;i++){ var x=TURNS[i]; if(!S.del[x.id]) t+=x.tok; else if(S.back[x.id]) t+=210; } return t; }
function fmtTok(n){ return n>=1000?(n/1000).toFixed(1)+'k':String(n); }
function renderTabs(){
  var bar=$('tabs'); bar.textContent='';
  var names=[['dialog','对话'],['trace','轨迹'],['ctx','上下文'],['edit','编辑']];
  for(var i=0;i<names.length;i++){
    (function(key,label){
      var t=el('button','tab'+(S.tab===key?' on':''),label);
      t.setAttribute('data-tab',key); t.onclick=function(){ S.tab=key; render(); };
      bar.appendChild(t);
    })(names[i][0],names[i][1]);
  }
  bar.appendChild(el('span','grow'));
  if(S.mode==='select'){
    bar.appendChild(el('span','selInfo','已选 '+countSel()+' 轮'));
    var cancel=el('button','tabAction','取消'); cancel.onclick=function(){ S.mode='normal'; S.sel={}; render(); };
    bar.appendChild(cancel);
  } else {
    var lab=el('label','tog'); var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!S.trace;
    cb.onchange=function(e){ S.trace=e.target.checked; render(); };
    lab.appendChild(cb); lab.appendChild(document.createTextNode('留痕迹')); bar.appendChild(lab);
    var pick=el('button','tabAction','选择对话'); pick.onclick=function(){ S.mode='select'; S.sel={}; S.tab='dialog'; render(); };
    bar.appendChild(pick);
  }
}
function userRow(t){ var row=el('div','uRow'); row.appendChild(el('div','uBubble',t.user)); return row; }
function blockNode(b){
  if(b.t==='text') return el('p','md',b.s);
  if(b.t==='tool'){
    var tl=el('div','toolLine');
    tl.appendChild(el('span','mark','→'));
    tl.appendChild(el('span','toolTxt',b.s));
    return tl;
  }
  var frame=el('div','codeFrame');
  var head=el('div','codeHead');
  head.appendChild(el('span','codeLang',b.lang||'text'));
  var acts=el('span','codeActs'); acts.appendChild(el('span','mini','⧉')); acts.appendChild(el('span','mini','⤢'));
  head.appendChild(acts); frame.appendChild(head);
  frame.appendChild(el('pre','codeBody',b.s));
  return frame;
}
function actsRow(t){
  var r=el('div','acts');
  var defs=[['⧉','复制'],['⑂','分支'],['🕘','历史']];
  for(var i=0;i<defs.length;i++){
    (function(p){
      var b=el('button','iconBtn',p[0]); b.title=p[1]; b.onclick=function(){ toast(p[1]+'（原型不落数据）'); }; r.appendChild(b);
    })(defs[i]);
  }
  var more=el('button','iconBtn more','⋯'); more.title='更多';
  more.setAttribute('data-act','more'); more.setAttribute('data-id',String(t.id));
  r.appendChild(more);
  return r;
}
function turnNode(t){
  var wrap=el('div','turn'+(S.sel[t.id]?' sel':'')+(t.stray?' stray':'')+(S.mode==='select'?' pickable':''));
  if(S.mode==='select'){
    var gut=el('div','gutter');
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!S.sel[t.id]; cb.setAttribute('data-sel',String(t.id));
    gut.appendChild(cb); wrap.appendChild(gut);
  }
  var body=el('div','tbody');
  body.appendChild(userRow(t));
  if(t.status || t.streaming){
    var st=el('div','statusLine');
    if(t.streaming){
      st.appendChild(el('span','spin','◌'));
      st.appendChild(el('span',null,'正在生成'));
      var stop=el('button','stopBtn','撤回这次提问');
      stop.setAttribute('data-act','withdraw'); stop.setAttribute('data-id',String(t.id));
      st.appendChild(stop);
    } else {
      st.appendChild(el('span',null,t.status));
      st.appendChild(el('span','mark','⌄'));
    }
    body.appendChild(st);
  }
  for(var i=0;i<t.blocks.length;i++) body.appendChild(blockNode(t.blocks[i]));
  body.appendChild(actsRow(t));
  wrap.appendChild(body);
  return wrap;
}
function removedNode(t){
  var wrap=el('div','turn removed');
  var line=el('div','removedLine');
  line.appendChild(el('span','mark','⌫'));
  line.appendChild(el('span','removedTxt','已移除第 '+t.id+' 轮'+(t.stray?'（误发）':'')+' · 模型已看不到 · 原文仍在日志'));
  var e=el('button','link',S.exp[t.id]?'收起原文':'展开原文'); e.setAttribute('data-act','exp'); e.setAttribute('data-id',String(t.id)); line.appendChild(e);
  if(!S.back[t.id]){ var b=el('button','link','补回为一条消息'); b.setAttribute('data-act','back'); b.setAttribute('data-id',String(t.id)); line.appendChild(b); }
  else line.appendChild(el('span','backOk','已补回 1 条消息'));
  wrap.appendChild(line);
  if(S.exp[t.id]){
    var box=el('div','origBox');
    box.appendChild(el('div','origK','原始记录（只读）'));
    box.appendChild(el('div','origV','你：'+t.user));
    for(var i=0;i<t.blocks.length;i++){ if(t.blocks[i].t!=='tool') box.appendChild(el('div','origV','DSH：'+t.blocks[i].s)); }
    wrap.appendChild(box);
  }
  return wrap;
}
function renderDialog(){
  var box=$('view'); box.textContent='';
  box.appendChild(el('div','pill','加载更早'));
  for(var i=0;i<TURNS.length;i++){ var t=TURNS[i]; box.appendChild(S.del[t.id] ? removedNode(t) : turnNode(t)); }
}
function renderTrace(){
  var box=$('view'); box.textContent='';
  box.appendChild(el('p','md traceNote','会话日志（append-only）。删除只是追加一条 surface 替换事件：被划掉的行仍然在文件里，seq 没有断。'));
  var seq=0;
  for(var i=0;i<TURNS.length;i++){
    var t=TURNS[i], gone=!!S.del[t.id];
    var rows=[['user/message','append',t.user],
              [t.tool?'tool/call':'assistant/message','append',t.tool?'读取 src/api/customers.ts':'助手回复 '+t.blocks.length+' 段']];
    if(gone) rows.push(['user/message','replace → 遮蔽本轮','']);
    for(var r=0;r<rows.length;r++){
      var line=el('div','evt'+(gone?' gone':''));
      line.appendChild(el('span','seq','#'+(seq++)));
      line.appendChild(el('span','etype',rows[r][0]));
      var op=el('span','eop',rows[r][1]); if(rows[r][1].indexOf('replace')===0) op.className='eop rep';
      line.appendChild(op);
      line.appendChild(el('span','etxt',short(rows[r][2]||'',40)));
      box.appendChild(line);
    }
  }
}
function renderCtx(){
  var box=$('view'); box.textContent='';
  box.appendChild(el('p','md traceNote','下一条请求实际会带上什么。被删除的轮次从这里消失 —— 这才是注意力不被污染的证据。'));
  var total=0, list=[];
  for(var i=0;i<TURNS.length;i++){
    var t=TURNS[i];
    if(S.del[t.id]){ if(S.back[t.id]){ list.push(['补回','原第 '+t.id+' 轮全文，以单条消息放回']); total+=210; } continue; }
    if(t.streaming) continue;
    list.push(['user',short(t.user,46)]);
    for(var b=0;b<t.blocks.length;b++){ if(t.blocks[b].t!=='text') list.push([t.blocks[b].t==='tool'?'tool':'code',short(t.blocks[b].s,40)]); }
    list.push(['assistant','（本轮回复）']);
    total+=t.tok;
  }
  var meter=el('div','meter'); var fill=el('i'); fill.style.width=Math.min(100,total/3600*100)+'%'; meter.appendChild(fill); box.appendChild(meter);
  var lab=el('div','ctxLine'); lab.appendChild(el('b',null,fmtTok(total)+' tokens'));
  var d=BASE-total; lab.appendChild(el('span','deltaOK',d>0?('−'+fmtTok(d)+'  相对初始'):'无变化')); box.appendChild(lab);
  for(var j=0;j<list.length;j++){
    var row=el('div','ctxRow');
    row.appendChild(el('span','ck',list[j][0])); row.appendChild(el('span','cv',list[j][1]));
    box.appendChild(row);
  }
}
function render(){
  renderTabs();
  if(S.tab==='dialog') renderDialog();
  else if(S.tab==='trace') renderTrace();
  else if(S.tab==='ctx') renderCtx();
  else { var box=$('view'); box.textContent=''; box.appendChild(el('p','md traceNote','编辑模式（原型未实现）。真实 DSH 里这里是编辑本轮输入 / 重新生成之前的草稿区。')); }
  $('tokBar').textContent = fmtTok(tokNow())+' tok · 缓存命中 98%';
  var f=$('floatDel'); f.textContent='';
  if(S.mode==='select'){
    f.hidden=false; var n=countSel();
    var b=el('button','delFloat','删除'+(n?' ('+n+')':'')); b.disabled=(n===0); b.onclick=function(){ deleteTurns(selIds()); };
    f.appendChild(b);
  } else { f.hidden=true; }
}
function openMenu(id,node){
  var m=$('menu'); m.textContent='';
  var fav=el('button','mi','收藏'); fav.setAttribute('data-menu','fav');
  var delb=el('button','mi danger','删除'); delb.setAttribute('data-menu','del'); delb.setAttribute('data-id',String(id));
  m.appendChild(fav); m.appendChild(delb); m.hidden=false;
  var r=node.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.right-140,window.innerWidth-160))+'px';
  m.style.top=(r.bottom+6)+'px';
  S.menu=id;
}
function closeMenu(){ $('menu').hidden=true; S.menu=null; }
function closeModal(){ $('modal').hidden=true; }
function deleteTurns(ids){
  if(!ids.length) return;
  var tool=null;
  for(var i=0;i<ids.length;i++){ var t=TURNS[ids[i]-1]; if(t.tool) tool=ids[i]; }
  if(tool) confirmSheet(ids,tool); else applyDelete(ids);
}
function applyDelete(ids){
  for(var i=0;i<ids.length;i++) S.del[ids[i]]=true;
  S.sel={}; S.mode='normal'; closeModal(); render();
  toast('已删除 '+ids.length+' 轮 · 模型视野已更新，日志未改动');
}
function confirmSheet(ids,tool){
  var sh=$('sheet'); sh.textContent='';
  sh.appendChild(el('h2',null,'确认删除'));
  var ul=el('ul','plist');
  for(var a=0;a<ids.length;a++){ var t=TURNS[ids[a]-1]; ul.appendChild(el('li',null,'第 '+t.id+' 轮 · '+short(t.user,26)+(t.stray?'（误发）':''))); }
  sh.appendChild(ul);
  var w=el('div','warnbox');
  w.appendChild(el('div','wi','✓ 模型之后看不到这些轮次，下一条请求起生效'));
  w.appendChild(el('div','wi','✓ 原文完整留在日志里，可展开查看、可补回成一条消息'));
  w.appendChild(el('div','wi ok','✓ 会话照常可聊、可重启、可 fork（日志一行都没动）'));
  w.appendChild(el('div','wi bad','⚠ 第 '+tool+' 轮含工具调用：删除只清上下文，已改的文件不会回滚'));
  w.appendChild(el('div','wi bad','⚠ 结构不可复原：补回只能把原文作为一条消息放回去'));
  sh.appendChild(w);
  sh.appendChild(el('p','sub','只有含工具调用的轮次才弹这个确认，纯对话直接删。'));
  var row=el('div','mrow');
  var c=el('button','btnGhost','取消'); c.onclick=closeModal;
  var d=el('button','btnDanger','确认删除'); d.onclick=function(){ applyDelete(ids); };
  row.appendChild(c); row.appendChild(d); sh.appendChild(row);
  $('modal').hidden=false;
}
function withdraw(id){ S.streaming=false; S.del[id]=true; render(); toast('已停止生成并整轮遮蔽：这一轮从未进入下一次请求'); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.tm); toast.tm=setTimeout(function(){ t.hidden=true; },2600); }
$('view').addEventListener('click',function(e){
  if(S.mode==='select'){
    var tn=e.target.closest('.turn');
    if(!tn) return;
    var box=tn.querySelector('[data-sel]');
    if(!box || e.target===box) return;
    var id=Number(box.getAttribute('data-sel'));
    box.checked=!box.checked; S.sel[id]=box.checked; render(); return;
  }
  var node=e.target;
  while(node && node!==this && !node.getAttribute('data-act')) node=node.parentNode;
  if(!node || node===this) return;
  var a=node.getAttribute('data-act');
  var id=Number(node.getAttribute('data-id'));
  if(a==='more') openMenu(id,node);
  else if(a==='exp'){ S.exp[id]=!S.exp[id]; render(); }
  else if(a==='back'){ S.back[id]=true; render(); toast('已把原文作为一条消息补回上下文（结构不可复原）'); }
  else if(a==='withdraw') withdraw(id);
});
$('view').addEventListener('change',function(e){
  var t=e.target;
  if(t && t.getAttribute && t.getAttribute('data-sel')){ S.sel[Number(t.getAttribute('data-sel'))]=t.checked; render(); }
});
$('menu').addEventListener('click',function(e){
  var b=e.target.closest('[data-menu]');
  if(!b) return;
  if(b.getAttribute('data-menu')==='fav') toast('已收藏（原型不落数据）');
  else deleteTurns([Number(b.getAttribute('data-id'))]);
  closeMenu();
});
document.addEventListener('click',function(e){
  if(S.menu && !e.target.closest('.more') && !e.target.closest('#menu')) closeMenu();
});
$('sendBtn').onclick=function(){ toast('原型：这里只会发消息，不会真的删除'); };
render();
</script>
</body></html>
